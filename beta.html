<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>内测通道 · Chert Launcher 2.6.0</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="燧石启动器内测通道（受邀测试人员专用）。" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #0f1115; --bg-soft: #161922; --card: #1c2030; --card-hover: #232838;
      --text: #e8ecf4; --muted: #9aa3b2; --brand: #2196F3; --brand-2: #21cbf3;
      --border: #2a3042; --radius: 16px; --shadow: 0 10px 30px rgba(0,0,0,.35);
      --warn: #ffb74d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 70% -10%, #2a1f44 0%, var(--bg) 55%) fixed;
      color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased;
    }
    a { color: var(--brand-2); text-decoration: none; }
    .wrap { max-width: 920px; margin: 0 auto; padding: 0 20px; }
    header.nav { position: sticky; top: 0; z-index: 50; backdrop-filter: blur(12px); background: rgba(15,17,21,.72); border-bottom: 1px solid var(--border); }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
    .brand svg { width: 34px; height: 34px; }
    a.back { color: var(--muted); font-size: 14px; }
    a.back:hover { color: var(--text); }

    .hero { padding: 64px 0 36px; }
    .tag { display: inline-block; font-size: 12px; font-weight: 700; color: #1a0e00; background: var(--warn); border-radius: 999px; padding: 4px 12px; }
    .hero h1 { font-size: 38px; font-weight: 800; margin: 16px 0 10px; letter-spacing: -.5px; }
    .hero p.lead { color: var(--muted); font-size: 16px; max-width: 640px; }
    .ver { color: var(--brand-2); font-weight: 700; }

    .notice { background: rgba(255,183,77,.08); border: 1px solid rgba(255,183,77,.35); color: var(--warn); border-radius: 12px; padding: 14px 16px; font-size: 14px; margin: 22px 0; }

    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 10px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; transition: .18s; }
    .card:hover { background: var(--card-hover); transform: translateY(-3px); box-shadow: var(--shadow); }
    .card .os { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
    .card .os .ico { width: 30px; height: 30px; }
    .card .dl { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    .card .dl a { font-size: 14px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; color: var(--text); background: var(--bg-soft); }
    .card .dl a:hover { border-color: var(--brand); text-decoration: none; }
    .card .dl a.disabled { opacity: .5; pointer-events: none; }

    .changelog { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 26px; margin-top: 30px; }
    .changelog h3 { font-size: 20px; margin-bottom: 6px; }
    .changelog .meta { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .changelog pre { white-space: pre-wrap; word-break: break-word; font-family: inherit; font-size: 14.5px; color: var(--text); background: var(--bg-soft); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }

    footer { border-top: 1px solid var(--border); padding: 30px 0 50px; color: var(--muted); font-size: 14px; }
    footer a { color: var(--muted); } footer a:hover { color: var(--text); }

    @media (max-width: 860px) { .cards { grid-template-columns: 1fr; } .hero h1 { font-size: 30px; } }
  </style>
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <div class="brand">
        <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2196F3"/><stop offset="1" stop-color="#21cbf3"/></linearGradient></defs>
          <rect x="2" y="2" width="36" height="36" rx="10" fill="url(#g)"/>
          <text x="20" y="27" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">C</text>
        </svg>
        内测通道
      </div>
      <a class="back" href="index.html">← 返回主页（稳定版 2.6.0）</a>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <span class="tag">BETA · 仅受邀测试</span>
      <h1>燧石启动器 <span class="ver" id="ver">读取中…</span></h1>
      <p class="lead">这是内测版本，仅供受邀测试人员使用。主页稳定版同为 <b>2.6.0</b>。内测包经由本通道先行分发，自动更新源亦指向本站点。</p>
    </section>

    <div class="notice">
      ⚠ 内测通道：本页提供 v2.6.0 内测构建（已数字签名，8 个 exe 全部 Valid），仅供受邀测试人员下载。遇到问题请在测试群反馈；稳定版正式发布后本通道将同步切换。
    </div>

    <div class="cards" id="cards">
      <div class="card">
        <div class="os">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#21cbf3" stroke-width="1.8"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
          Windows
        </div>
        <div class="dl" id="dl-win"></div>
      </div>
      <div class="card">
        <div class="os">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#21cbf3" stroke-width="1.8"><path d="M3 17h18M6 17c0-4 3-7 6-7s6 3 6 7M12 4v6M9 7l3-3 3 3"/></svg>
          Linux
        </div>
        <div class="dl" id="dl-linux"></div>
      </div>
      <div class="card">
        <div class="os">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#21cbf3" stroke-width="1.8"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M10 18h4"/></svg>
          Android
        </div>
        <div class="dl" id="dl-android"></div>
      </div>
    </div>

    <section class="changelog">
      <h3 id="cl-ver">更新说明</h3>
      <div class="meta" id="cl-meta"></div>
      <pre id="cl-body">正在从 latest.json 加载…</pre>
    </section>
  </main>

  <footer>
    <div class="wrap">© <span id="year"></span> RLRS Studio · 燧石启动器 Chert Launcher（内测通道）</div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const CNB = "https://cnb.cool/RLRS-Studio";
    const GH = "https://github.com/BingJian-REMIX";
    const tag = v => "v" + v;
    function link(href, text, disabled) {
      return `<a href="${href}" target="_blank" rel="noopener"${disabled ? ' class="disabled"' : ''}>${text}</a>`;
    }
    fetch('latest.json', { cache: 'no-cache' })
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(data => {
        const wpf = data.wpf || {};
        const ver = wpf.version || '2.6.0';
        document.getElementById('ver').textContent = ver + (wpf.channel ? ' · ' + wpf.channel : '');
        document.getElementById('cl-ver').textContent = 'Chert Launcher ' + ver + '（内测）';
        document.getElementById('cl-meta').textContent =
          (wpf.channel ? '通道：' + wpf.channel + '　' : '') + (wpf.releaseDate ? '发布日期：' + wpf.releaseDate : '');

        document.getElementById('dl-win').innerHTML =
          link(`${CNB}/Chert-WPF/-/releases/download/${tag(ver)}/Chert-Launcher-${ver}-win-x64.zip`, '⬇ 完整包（自包含）') +
          link(`${CNB}/Chert-WPF/-/releases/download/${tag(ver)}/Chert-Light-${ver}-win-x64.zip`, '⬇ 轻量版') +
          link(`${GH}/Chert-WPF/releases/tag/${tag(ver)}`, 'GitHub 镜像');

        const lin = data.linux || {};
        const linVer = lin.version && lin.version !== '0.0.0' ? lin.version : ver;
        document.getElementById('dl-linux').innerHTML =
          link(`${CNB}/MCLCS-Linux/-/releases/download/${tag(linVer)}/MCLCS-Linux-${linVer}-linux-x64.tar.gz`, '⬇ tar.gz（自包含）') +
          link(`${GH}/Chert-Linux/releases/tag/${tag(linVer)}`, 'GitHub 镜像');

        document.getElementById('dl-android').innerHTML =
          link(`${GH}/Chert-Android/releases`, 'GitHub Release（Android）');

        document.getElementById('cl-body').textContent = wpf.changelog || '暂无更新说明。';
      })
      .catch(() => {
        document.getElementById('ver').textContent = '2.6.0';
        document.getElementById('cl-body').textContent = '无法读取 latest.json，请稍后重试或联系发布者。';
      });
  </script>
</body>
</html>
